plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.parcelize
    alias libs.plugins.ksp
}

apply from: '../signing.gradle'

//#ifdef NONFREE
// These two come from the root project's buildscript classpath rather than the plugins block:
// applying them through the plugins DSL makes generateDebugBuildConfig run too late, and the
// custom BuildConfig fields never reach the Kotlin compiler.
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
//#endif

android {
    namespace 'me.zhanghai.android.files'
    buildToolsVersion libs.versions.buildTools.get()
    compileSdk 37
    compileSdkMinor 2
    ndkVersion libs.versions.ndk.get()
    defaultConfig {
        applicationId 'me.zhanghai.android.files'
        minSdk 23
        // Not supporting the ACCESS_LOCAL_NETWORK runtime permission yet.
        //noinspection OldTargetApi
        targetSdk 36
        versionCode 40
        versionName '1.7.5'
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        viewBinding true
    }
    androidResources {
        generateLocaleConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
//#ifdef NONFREE
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }
//#endif
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    // https://github.com/kotlin/kotlinx.coroutines#avoiding-including-the-debug-infrastructure-in-the-resulting-apk
                    '/DebugProbesKt.bin',
                    '/META-INF/DEPENDENCIES',
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation libs.kotlin.stdlib.jdk8
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.exifinterface
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.common.java8
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material

    implementation libs.androidsvg
    implementation libs.subsampling.scale.image.view
    implementation libs.drawer
    implementation libs.materialshadowninepatch
    implementation libs.advrecyclerview
    implementation libs.licensesdialog
    implementation libs.insetter
    implementation libs.preferencex
    implementation libs.simplemenu.preference
    implementation libs.speed.dial
    implementation libs.photoview

    implementation(libs.dav4jvm) {
        exclude group: 'org.ogce', module: 'xpp3'
    }
    implementation libs.libsu
    implementation libs.libarchive
    implementation libs.libselinux
    implementation libs.retrofile
    implementation libs.systemuihelper
    implementation libs.foregroundcompat
    implementation libs.fastscroll
    implementation libs.appiconloader

    implementation(libs.smbj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    implementation libs.bouncycastle.bcprov.jdk15to18
    implementation(libs.sshj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation libs.bouncycastle.bcpkix.jdk15to18
    implementation(libs.dce.rpc) {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation libs.guava
    implementation libs.listablefuture
    implementation(libs.jcifs) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation libs.commons.net
    implementation libs.ftpserver.core
    implementation(libs.mina.core) {
        version {
            strictly libs.versions.mina.core.get()
        }
    }
    implementation libs.slf4j.android

    implementation libs.shizuku.api
    implementation libs.shizuku.provider

    implementation platform(libs.coil.bom)
    implementation libs.coil
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.coil.video

    // Parses and rewrites binary AndroidManifest.xml and resources.arsc when merging split APKs.
    implementation libs.arsclib
    // Signs the merged APK produced by the split APK merger.
    implementation libs.apksig

    // Room keeps the file name index that makes search fast.
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    // BundledSQLiteDriver ships a SQLite new enough for FTS5 and its trigram tokenizer, unlike the
    // SQLite that the oldest supported Android releases provide.
    implementation libs.androidx.sqlite.bundled

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    // The same bundled SQLite for JVM unit tests, so index queries run against real FTS5 instead of
    // a mock.
    testImplementation libs.androidx.sqlite.bundled.jvm
    testImplementation libs.androidx.sqlite.jvm

//#ifdef NONFREE
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics.ndk
//#endif
}

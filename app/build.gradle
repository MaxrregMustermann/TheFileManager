apply from: '../signing.gradle'

//#ifdef NONFREE
// These two come from the root project's buildscript classpath rather than the plugins block:
// applying them through the plugins DSL makes generateDebugBuildConfig run too late, and the
// custom BuildConfig fields never reach the Kotlin compiler.
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
//#endif

// The Rust half of the archive support, built from source during the build and packaged as an
// ordinary native library.
//
// The output goes into the build directory rather than into src/main/jniLibs, so a build never leaves
// a few megabytes of shared objects in the working tree and `git clean` is enough to get back to a
// state that builds.
//
// A missing toolchain is a warning rather than a failure. That keeps a checkout without Rust or the
// NDK able to assemble the app, where archives fall back to libarchive. It is deliberately not the
// other way round: an app that silently archives with the old library because a developer forgot to
// install Rust is worse than one that does not build.
def rustArchiveAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']

// Where cargo and cargo-ndk are, when they were installed with rustup rather than from a package.
def rustCargoBin = providers.provider {
    def cargo = System.getenv('CARGO_HOME') ?: "${System.getProperty('user.home')}/.cargo"
    file("$cargo/bin").absolutePath
}
def rustArchiveOutputDir = layout.buildDirectory.dir('rustArchive/jniLibs')

// Where libarchive-rs lives. It is a separate repository from the app, so the path is a property
// rather than a relative path fixed here: point it at a checkout with -PlibarchiveRsPath=..., which
// is how a branch is proved before it is merged into the one the default names.
//
// The default is the checkout beside the app, which is where the integration branch is.
def libarchiveRsDirectory = providers.gradleProperty('libarchiveRsPath')
        .map { file(it) }
        .orElse(rootProject.file('../libarchive-rs'))

// The cdylib comes from the `jni` crate, which is the only one that is a cdylib. Its [lib] name is
// `rust_archive`, so the output is librust_archive.so and `System.loadLibrary("rust_archive")` in
// RustArchive.kt keeps working unchanged.
def rustArchivePackage = 'libarchive-jni'

// The Cargo profile the JNI cdylib is built with, and not `release`.
//
// The library's `[profile.release]` sets `panic = "abort"`, which is right for the library and
// wrong for this cdylib: a Rust panic that reaches an `extern "system"` boundary on Android does not
// become a Java exception, it aborts the process. Under abort the `catch_unwind` guard in
// jni/src/lib.rs never runs, so a malformed archive costs the user the app rather than an error.
// `release-unwind` inherits release unchanged and only sets `panic = "unwind"`; measured cost is
// 5599456 -> 6091732 bytes for the x86 library, +8.8%.
//
// Verified rather than assumed, from the library:
//     cargo run --profile release        --example panic_guard   -> SIGABRT, no output
//     cargo run --profile release-unwind --example panic_guard   -> caught, exit 0
// and the guard below checks at configuration time that this profile still exists there, because
// a profile that silently went missing would ship the aborting build and every test would still
// be green.
def rustArchiveProfile = 'release-unwind'

// The NDK is not on the PATH, so cargo-ndk is told where it is. Reading it out of local.properties
// rather than out of the AGP model, which only knows the NDK once the android block has been
// evaluated, which is after this task has to be configured.
def rustNdkDirectory = providers.provider {
    def propertiesFile = rootProject.file('local.properties')
    def sdkDirectory = new Properties()
    if (propertiesFile.isFile()) {
        propertiesFile.withInputStream { sdkDirectory.load(it) }
    }
    def sdkPath = sdkDirectory.getProperty('sdk.dir')
    if (sdkPath == null) {
        throw new GradleException('sdk.dir is not set in local.properties, so the NDK the Rust ' +
                'archive library needs cannot be found.')
    }
    file("$sdkPath/ndk/${libs.versions.ndk.get()}").absolutePath
}

tasks.register('buildRustArchive', Exec) {
    group = 'build'
    description = 'Builds the Rust archive library for every ABI the app ships.'
    // The rule for what is an input: anything that can change the archive cargo links into the APK.
    // That is the workspace manifest and lockfile, and for each workspace member its own manifest
    // and its sources under src/. There is no build script anywhere in libarchive-rs (no build.rs,
    // and both vendored members set build = false), so nothing outside those paths is read while
    // linking.
    //
    // Test, bench, and example files are deliberately not inputs. Nothing under tests/, benches/,
    // or examples/ is compiled into the cdylib, so editing one cannot change librust_archive.so
    // and should not cost a rebuild of it. The vendored members are declared manifest plus src/ for
    // the same reason, which is a change from tracking their whole directories: their READMEs,
    // PATCHES.md, and tests are not inputs either.
    inputs.file(new File(libarchiveRsDirectory.get(), 'Cargo.toml'))
    inputs.file(new File(libarchiveRsDirectory.get(), 'Cargo.lock'))
    inputs.file(new File(libarchiveRsDirectory.get(), 'libarchive/Cargo.toml'))
    inputs.dir(new File(libarchiveRsDirectory.get(), 'libarchive/src'))
    inputs.file(new File(libarchiveRsDirectory.get(), 'jni/Cargo.toml'))
    inputs.dir(new File(libarchiveRsDirectory.get(), 'jni/src'))
    inputs.file(new File(libarchiveRsDirectory.get(), 'vendor/unarc-rs/Cargo.toml'))
    inputs.dir(new File(libarchiveRsDirectory.get(), 'vendor/unarc-rs/src'))
    inputs.file(new File(libarchiveRsDirectory.get(), 'vendor/sevenz-rust2/Cargo.toml'))
    inputs.dir(new File(libarchiveRsDirectory.get(), 'vendor/sevenz-rust2/src'))

    // Guard on the input list above: every workspace member's manifest and sources must be declared,
    // or a change to one of them leaves this task UP-TO-DATE and ships the previous binary. The
    // member list is read out of the library's workspace manifest, so a crate added there later
    // cannot be invisible. Runs when the task is configured, so it catches an under-declared input
    // even on an invocation where the task would have done nothing.
    def workspaceMemberManifest = new File(libarchiveRsDirectory.get(), 'Cargo.toml')
    if (workspaceMemberManifest.isFile()) {
        def memberList = workspaceMemberManifest.getText('UTF-8') =~ /(?sm)^\s*members\s*=\s*\[(.*?)\]/
        if (!memberList.find()) {
            throw new GradleException("No workspace member list found in ${workspaceMemberManifest}, " +
                    'so buildRustArchive cannot check its inputs against it.')
        }
        def workspaceMembers = (memberList.group(1) =~ /"([^"]+)"/).collect { it[1] }
        // inputs.file(...) registers the path and inputs.dir(...) the files under it, so a path is
        // covered when it is itself declared or a file beneath it is.
        def declaredInputs = inputs.files.files.collect { it.canonicalFile } as Set
        def covers = { File path ->
            declaredInputs.any { it == path || it.path.startsWith(path.path + File.separator) }
        }
        def untracked = workspaceMembers.findResults { member ->
            def memberDirectory = new File(libarchiveRsDirectory.get(), member).canonicalFile
            def missing = [new File(memberDirectory, 'Cargo.toml'), new File(memberDirectory, 'src')]
                    .findAll { it.exists() && !covers(it) }
            missing.isEmpty() ? null : missing
        }.flatten()
        if (!untracked.isEmpty()) {
            throw new GradleException("buildRustArchive does not declare ${untracked} as inputs, " +
                    'so editing them would leave the task UP-TO-DATE and the archive stale. Every ' +
                    'workspace member needs its Cargo.toml and its src/ directory declared.')
        }
    }

    // Guard on rustArchiveProfile above. Cargo is perfectly happy to be told `--profile` a profile
    // that does not exist: it treats an unknown profile name as a custom one with default
    // settings, which means `panic` falls back to `unwind` by accident rather than by decision, or
    // - if the name collides with something - the build succeeds with the wrong panic strategy and
    // nothing anywhere fails. Neither is acceptable for the one setting that decides whether a
    // corrupt archive is an error message or a dead process, so the profile is read out of the
    // library's workspace manifest and the task refuses to configure if it is not there with
    // `panic = "unwind"`.
    //
    // Runs when the task is configured rather than when it executes, so it catches a wrong profile
    // even on an invocation where the task would have been UP-TO-DATE and done nothing.
    def workspaceManifest = new File(libarchiveRsDirectory.get(), 'Cargo.toml')
    if (workspaceManifest.isFile()) {
        def manifestText = workspaceManifest.getText('UTF-8')
        def profileBlock = manifestText =~ /(?ms)^\[profile\.${java.util.regex.Pattern.quote(rustArchiveProfile)}\](.*?)(?=^\[|\z)/
        if (!profileBlock.find()) {
            throw new GradleException(
                    "libarchive-rs at ${workspaceManifest} has no [profile.${rustArchiveProfile}], " +
                    "which is the profile this task builds librust_archive.so with. Without it " +
                    'cargo falls back to its own defaults for an unknown profile name, so the ' +
                    'panic strategy stops being a decision. See the comment on rustArchiveProfile.')
        }
        if (!(profileBlock.group(1) =~ /panic\s*=\s*"unwind"/).find()) {
            throw new GradleException(
                    "[profile.${rustArchiveProfile}] in ${workspaceManifest} does not set " +
                    'panic = "unwind". Building the cdylib that way makes the catch_unwind guard ' +
                    'in jni/src/lib.rs dead code, and a panic on a corrupt archive aborts the app ' +
                    'instead of throwing.')
        }
    }
    outputs.dir(rustArchiveOutputDir)
    workingDir libarchiveRsDirectory.get()
    environment 'ANDROID_NDK_HOME', rustNdkDirectory.get()
    // Gradle does not inherit the shell's PATH by default for an Exec task, and cargo lives in the
    // per-user cargo bin directory rather than anywhere a system PATH would have it.
    environment 'PATH', rustCargoBin.get() + File.pathSeparator + System.getenv('PATH')
    environment 'CARGO_TARGET_DIR',
            layout.buildDirectory.dir('rustArchive/target').get().asFile.absolutePath
    def outputDirectory = rustArchiveOutputDir
    // cargo-ndk writes one directory per ABI, which is exactly the layout a jniLibs source wants.
    // cargo is named by absolute path because an Exec task resolves its command before the PATH set
    // above is visible to it.
    commandLine(
            [new File(rustCargoBin.get(), 'cargo').absolutePath, 'ndk'] +
                    rustArchiveAbis.collectMany { ['-t', it] } +
                    ['-o', outputDirectory.get().asFile.absolutePath, 'build',
                     '--profile', rustArchiveProfile, '--package', rustArchivePackage])
    doFirst {
        // Checked here rather than letting cargo fail with a path it does not recognise, because
        // "the directory you pointed at is not libarchive-rs" is the useful message and
        // "could not find Cargo.toml" is not.
        def source = libarchiveRsDirectory.get()
        if (!new File(source, 'jni/Cargo.toml').isFile()) {
            throw new GradleException("libarchive-rs was not found at ${source}. Point the build at a " +
                    'checkout with -PlibarchiveRsPath=/path/to/libarchive-rs, or set it in ' +
                    'gradle.properties.')
        }
        logger.lifecycle("Building ${rustArchivePackage} from ${source}")
        // Checked here rather than letting the exec fail, so the message says what to install.
        def cargoNdkVersion = providers.exec {
            commandLine new File(rustCargoBin.get(), 'cargo').absolutePath, 'ndk', '--version'
        }.standardOutput.asText.get().trim()
        logger.lifecycle("Building the Rust archive library with $cargoNdkVersion")
    }
    doLast {
        def output = outputDirectory.get().asFile
        def missingAbis = rustArchiveAbis.findAll {
            !new File(output, "$it/librust_archive.so").isFile()
        }
        if (!missingAbis.isEmpty()) {
            logger.warn("The Rust archive library was not built for $missingAbis. Archives will " +
                    'fall back to libarchive.')
        }
        // cargo-ndk copies every shared object the build produced, not just the one asked for. Only
        // librust_archive.so is ours to ship - it is the `jni` crate's [lib], which is the only
        // cdylib in libarchive-rs - and anything else it finds is roughly 300 KB per ABI sitting in
        // the APK with nothing to load it.
        output.eachFileRecurse { file ->
            if (file.name != 'librust_archive.so') {
                file.delete()
            }
        }
    }
}

// Anything that packages native code has to have the Rust library built first. This is a plain
// dependency rather than wiring the task into the merge tasks, so that the library is built once per
// build instead of once per ABI per task.
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('JniLibFolders') }
        .configureEach { dependsOn 'buildRustArchive' }


android {
    namespace 'me.zhanghai.android.files'
    buildToolsVersion libs.versions.buildTools.get()
    compileSdk 37
    compileSdkMinor 2
    ndkVersion libs.versions.ndk.get()
    defaultConfig {
        applicationId 'me.zhanghai.android.files'
        minSdk 23
        // Not supporting the ACCESS_LOCAL_NETWORK runtime permission yet.
        //noinspection OldTargetApi
        targetSdk 36
        versionCode 40
        versionName '1.7.5'
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        viewBinding true
    }
    androidResources {
        generateLocaleConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
//#ifdef NONFREE
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }
//#endif
        }
    }
    sourceSets {
        main {
            // The Rust library is built into the build directory rather than checked in. The
            // directory is passed as a plain path because the Android SourceSet API refuses a
            // Provider, and the task dependency below is what makes it exist before packaging.
            jniLibs.srcDir(rustArchiveOutputDir.get().asFile)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    // https://github.com/kotlin/kotlinx.coroutines#avoiding-including-the-debug-infrastructure-in-the-resulting-apk
                    '/DebugProbesKt.bin',
                    '/META-INF/DEPENDENCIES',
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation libs.kotlin.stdlib.jdk8
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.exifinterface
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.common.java8
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material

    implementation libs.androidsvg
    implementation libs.subsampling.scale.image.view
    implementation libs.drawer
    implementation libs.materialshadowninepatch
    implementation libs.advrecyclerview
    implementation libs.licensesdialog
    implementation libs.insetter
    implementation libs.preferencex
    implementation libs.simplemenu.preference
    implementation libs.speed.dial
    implementation libs.photoview

    implementation(libs.dav4jvm) {
        exclude group: 'org.ogce', module: 'xpp3'
    }
    implementation libs.libsu
    implementation libs.libarchive
    implementation libs.libselinux
    implementation libs.retrofile
    implementation libs.systemuihelper
    implementation libs.foregroundcompat
    implementation libs.fastscroll
    implementation libs.appiconloader

    implementation(libs.smbj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    implementation libs.bouncycastle.bcprov.jdk15to18
    implementation(libs.sshj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation libs.bouncycastle.bcpkix.jdk15to18
    implementation(libs.dce.rpc) {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation libs.guava
    implementation libs.listablefuture
    implementation(libs.jcifs) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation libs.commons.net
    implementation libs.ftpserver.core
    implementation(libs.mina.core) {
        version {
            strictly libs.versions.mina.core.get()
        }
    }
    implementation libs.slf4j.android

    implementation libs.shizuku.api
    implementation libs.shizuku.provider

    implementation platform(libs.coil.bom)
    implementation libs.coil
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.coil.video

    // Parses and rewrites binary AndroidManifest.xml and resources.arsc when merging split APKs.
    implementation libs.arsclib
    // Signs the merged APK produced by the split APK merger.
    implementation libs.apksig

    // Room keeps the file name index that makes search fast.
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    // BundledSQLiteDriver ships a SQLite new enough for FTS5 and its trigram tokenizer, unlike the
    // SQLite that the oldest supported Android releases provide.
    implementation libs.androidx.sqlite.bundled

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    // The same bundled SQLite for JVM unit tests, so index queries run against real FTS5 instead of
    // a mock.
    testImplementation libs.androidx.sqlite.bundled.jvm
    testImplementation libs.androidx.sqlite.jvm

//#ifdef NONFREE
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics.ndk
//#endif
}

[package]
name = "rust_archive"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rust_archive"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The JNI bridge, used to read from and write to the java.nio channels the app already has.
jni = "0.21"

# 7Z, for both reading and writing. The only one of the three that can write 7Z.
# `default-features = false` turns off the codecs this app never creates or reads.
sevenz-rust2 = { version = "0.23", default-features = false, features = [
    "aes256",
    "bzip2",
    "compress",
    "ppmd",
    "util",
] }
# Everything except 7Z, for writing, plus XZ for reading. Forked for its streaming writers:
# upstream buffered whole entries, which a file manager cannot afford for large files. The pinned
# revision also reuses the deflate encoder across entries and writes headers in one piece, which
# matters because every write here crosses into Java.
oxiarc-archive = { git = "https://github.com/MaxrregMustermann/oxiarc", rev = "93b17af" }
# Everything except 7Z and XZ, for reading.
unarc-rs = { version = "0.7", default-features = false }

[profile.release]
# Decompression is the hot path, and this crate exists to make archives open quickly, so the
# trade is size for speed. Measured at around 13% on reading a deflate archive.
opt-level = 3
lto = true
codegen-units = 1
strip = true

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The archive library lives in its own repository and the Gradle build looks for it next to
      # this one, so it is checked out into ../libarchive-rs.
      - name: Checkout libarchive-rs
        uses: actions/checkout@v7
        with:
          repository: MaxrregMustermann/libarchive-rs
          path: libarchive-rs

      # Robolectric needs Java 21 to run the Android 16 image, and AGP 9 needs 17 or newer.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;30.0.16248370"

      # The Gradle build defaults to a checkout *beside* the app, which is true of a local
      # workspace but not of a CI runner, so the path is passed explicitly instead.
      - name: Resolve the archive library path
        run: echo "LIBARCHIVE_RS_PATH=$GITHUB_WORKSPACE/libarchive-rs" >> "$GITHUB_ENV"
        env:
          LIBARCHIVE_RS_PATH: ${{ github.workspace }}/libarchive-rs

      # cargo-ndk drives the cross-compilation into the NDK toolchains.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: 'rustfmt,clippy'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The Gradle build defaults to a checkout *beside* the app. That is true of the local
      # workspace but not of a CI runner, where the second checkout lands inside it, so the path is
      # passed explicitly rather than relying on the default resolving.
      - name: Export the archive library path
        run: echo "LIBARCHIVE_RS_PATH=$GITHUB_WORKSPACE/libarchive-rs" >> "$GITHUB_ENV"


      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-*
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        env:
          # Robolectric downloads its Android runtime on first use and does not retry well, so the
          # download is cached explicitly rather than left to run on every job.
          GRADLE_OPTS: "-Dorg.gradle.caching=true"
          # The Rust library is built inside Gradle; keep its target directory off the runner's
          # small tmpfs and out of the repository.
          CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
        run: ./gradlew -PlibarchiveRsPath="$LIBARCHIVE_RS_PATH" :app:testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew -PlibarchiveRsPath="$LIBARCHIVE_RS_PATH" :app:lint --stacktrace

      - name: Build debug APK
        run: ./gradlew -PlibarchiveRsPath="$LIBARCHIVE_RS_PATH" :app:assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew -PlibarchiveRsPath="$LIBARCHIVE_RS_PATH" :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-file-manager
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error